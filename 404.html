<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página no encontrada — ComparaPortátil</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f5f5f7; color: #1d1d1f; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
    padding: 24px;
  }
  .box { max-width: 460px; }
  .code { font-size: 80px; font-weight: 700; letter-spacing: -.06em; color: #0071e3; line-height: 1; }
  h1 { font-size: 26px; letter-spacing: -.03em; margin: 14px 0 10px; }
  p { color: #6e6e73; line-height: 1.6; margin: 0 0 24px; }
  a {
    display: inline-block; background: #0071e3; color: #fff; text-decoration: none;
    padding: 12px 22px; border-radius: 999px; font-weight: 600; font-size: 14px;
  }
  a:hover { background: #0062c4; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
    <a href="./">Volver al comparador</a>
  </div>
</body>
</html>
